<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta http-equiv="Content-Style-Type" content="text/css">
  <title></title>
  <meta name="Generator" content="Cocoa HTML Writer">
  <meta name="CocoaVersion" content="2685.7">
  <style type="text/css">
    span.s1 {font-kerning: none}
  </style>
<style>
  :root {
    --bg-color: #f3f4f6;
    --card-bg: #ffffff;
    --text-color: #1f2937;
    --accent-color: #2563eb;
    --border-radius: 16px;
  }

  /* Center the content on the screen */
  body {
    background-color: var(--bg-color);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text-color);
    margin: 0;
    padding: 2rem 1rem;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
  }

  /* Transform the existing h1 tags into a cohesive profile card layout */
  body > h1 {
    background-color: var(--card-bg);
    max-width: 480px;
    width: 100%;
    margin: 0 auto !important; /* Overrides inline margin */
    padding: 1.5rem 2rem;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    -webkit-text-stroke: 0px !important; /* Overrides the harsh outline font */
    font-family: inherit !important; /* Overrides Times New Roman */
    box-sizing: border-box;
  }

  /* Style the first h1 (The Greeting) to look like a profile header */
  body > h1:nth-of-type(1) {
    padding-top: 3rem;
    border-top-left-radius: var(--border-radius);
    border-top-right-radius: var(--border-radius);
    font-size: 2.25rem !important;
    font-weight: 800;
    letter-spacing: -0.025em;
    color: var(--accent-color);
  }

  /* Style the second h1 (The Subtitle) */
  body > h1:nth-of-type(2) {
    font-size: 1.25rem !important;
    font-weight: 500;
    color: #4b5563;
    border-bottom: 1px solid #e5e7eb;
    padding-bottom: 2rem;
  }

  /* Style the third h1 (The Highlight Feature) */
  body > h1:nth-of-type(3) {
    padding-top: 2rem;
    padding-bottom: 3rem;
    border-bottom-left-radius: var(--border-radius);
    border-bottom-right-radius: var(--border-radius);
    font-size: 1.1rem !important;
    font-weight: 400;
    color: #6b7280;
  }

  /* Highlight the actual Git command text within the third header */
  body > h1:nth-of-type(3) span {
    display: inline-block;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    padding: 0.25rem 0.5rem;
    border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    color: #0f172a;
  }
</style>

</head>
<body>
<h1 style="margin: 0.0px 0.0px 16.1px 0.0px; font: 24.0px Times; -webkit-text-stroke: #000000"><span class="s1"><b>Hello, I am</b></span></h1>
<h1 style="margin: 0.0px 0.0px 16.1px 0.0px; font: 24.0px Times; -webkit-text-stroke: #000000"><span class="s1"><b>I am learning Git today</b></span></h1>
<h1 style="margin: 0.0px 0.0px 16.1px 0.0px; font: 24.0px Times; -webkit-text-stroke: #000000"><span class="s1"><b>My favourite Git command so far: git commit -m “”</b></span></h1>
</body>
</html>
